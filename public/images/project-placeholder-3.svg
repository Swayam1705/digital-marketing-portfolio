<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder email and analytics campaign dashboard image">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161226"/>
      <stop offset="0.6" stop-color="#241a4d"/>
      <stop offset="1" stop-color="#3a2254"/>
    </linearGradient>
    <linearGradient id="p3c" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a66"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#p3bg)"/>
  <circle cx="180" cy="140" r="220" fill="#633ef2" opacity="0.3"/>

  <!-- email card -->
  <g transform="translate(120 170)">
    <rect x="0" y="0" width="420" height="280" rx="28" fill="#201946" stroke="#8b6cff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="36" y="40" width="200" height="18" rx="9" fill="#e9e3fb"/>
    <rect x="36" y="78" width="300" height="12" rx="6" fill="#e9e3fb" opacity="0.45"/>
    <rect x="36" y="104" width="260" height="12" rx="6" fill="#e9e3fb" opacity="0.35"/>
    <path d="M36 170 L205 260 L374 170" fill="none" stroke="#ff9b85" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="36" y="158" width="348" height="96" rx="18" fill="none" stroke="#8b6cff" stroke-opacity="0.6" stroke-width="6"/>
  </g>

  <!-- analytics card -->
  <g transform="translate(620 120)">
    <rect x="0" y="0" width="460" height="330" rx="28" fill="#201946" stroke="#8b6cff" stroke-opacity="0.5" stroke-width="2"/>
