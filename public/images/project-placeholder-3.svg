    <!-- bars -->
    <rect x="50" y="250" width="44" height="40" rx="8" fill="#8b6cff"/>
    <rect x="118" y="212" width="44" height="78" rx="8" fill="#8b6cff"/>
    <rect x="186" y="178" width="44" height="112" rx="8" fill="#b39cff"/>
    <rect x="254" y="140" width="44" height="150" rx="8" fill="url(#p3c)"/>
    <rect x="322" y="96"  width="44" height="194" rx="8" fill="#ff7a66"/>
    <path d="M60 220 L140 190 L208 160 L276 120 L344 78" fill="none" stroke="#ffd9c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="344" cy="78" r="10" fill="#ffd9c8"/>
  </g>

  <!-- KPI chips -->
  <g transform="translate(120 520)">
    <rect x="0" y="0" width="290" height="120" rx="26" fill="#201946" stroke="#8b6cff" stroke-opacity="0.4"/>
    <rect x="30" y="34" width="120" height="14" rx="7" fill="#cdbffb" opacity="0.7"/>
    <rect x="30" y="66" width="180" height="26" rx="8" fill="#ff9b85" opacity="0.85"/>
    <rect x="320" y="0" width="290" height="120" rx="26" fill="#201946" stroke="#8b6cff" stroke-opacity="0.4"/>
    <rect x="350" y="34" width="120" height="14" rx="7" fill="#cdbffb" opacity="0.7"/>
    <rect x="350" y="66" width="150" height="26" rx="8" fill="#8b6cff"/>
    <rect x="640" y="0" width="290" height="120" rx="26" fill="#201946" stroke="#8b6cff" stroke-opacity="0.4"/>
    <rect x="670" y="34" width="120" height="14" rx="7" fill="#cdbffb" opacity="0.7"/>
    <rect x="670" y="66" width="200" height="26" rx="8" fill="#ff9b85" opacity="0.85"/>
