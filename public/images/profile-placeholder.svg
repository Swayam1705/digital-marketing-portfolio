<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder profile portrait illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9fd"/>
      <stop offset="0.55" stop-color="#e4dafb"/>
      <stop offset="1" stop-color="#ffd9c8"/>
    </linearGradient>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#4721c9"/>
    </linearGradient>
    <linearGradient id="sil2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9b85"/>
      <stop offset="1" stop-color="#ff6f5e"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#dots)"/>

  <!-- soft orbs -->
  <circle cx="120" cy="130" r="120" fill="#ffffff" opacity="0.35"/>
  <circle cx="700" cy="700" r="150" fill="#ff7a66" opacity="0.18"/>

  <!-- abstract portrait silhouette -->
  <g>
    <circle cx="400" cy="315" r="120" fill="url(#sil)"/>
    <path d="M190 700 C190 540 290 470 400 470 C510 470 610 540 610 700 Z" fill="url(#sil)"/>
    <path d="M400 195 C350 195 310 240 310 300 C310 308 312 318 315 326 C322 280 356 250 400 250 C444 250 478 280 485 326 C488 318 490 308 490 300 C490 240 450 195 400 195 Z"
          fill="#171326" opacity="0.18"/>
  </g>

  <!-- coral accent arc -->
  <path d="M160 640 C300 560 500 560 640 640" fill="none" stroke="url(#sil2)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- placeholder tag -->
  <g>
    <rect x="230" y="712" width="340" height="52" rx="26" fill="#171326" opacity="0.85"/>
    <text x="400" y="746" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif"
          font-size="22" font-weight="600" letter-spacing="3" fill="#f7f4f0">PROFILE PLACEHOLDER</text>
  </g>
</svg>
