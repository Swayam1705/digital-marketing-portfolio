<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder strategy and campaign planning board image">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ecff"/>
      <stop offset="1" stop-color="#ffe3d8"/>
    </linearGradient>
    <linearGradient id="p2v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#633ef2"/>
      <stop offset="1" stop-color="#4721c9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#p2bg)"/>
  <circle cx="160" cy="160" r="200" fill="#fff" opacity="0.6"/>
  <circle cx="1080" cy="760" r="240" fill="#8b6cff" opacity="0.14"/>

  <!-- strategy board -->
  <g transform="translate(140 120)">
    <rect x="0" y="0" width="920" height="580" rx="32" fill="#ffffff" opacity="0.85" stroke="#d9d0f7" stroke-width="3"/>

    <!-- funnel -->
    <g transform="translate(80 70)">
      <rect x="0" y="0" width="760" height="78" rx="18" fill="url(#p2v)"/>
      <text x="380" y="49" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#fff">REACH</text>
      <rect x="80" y="104" width="600" height="78" rx="18" fill="#8b6cff"/>
      <text x="380" y="153" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#fff">ENGAGEMENT</text>
      <rect x="160" y="208" width="440" height="78" rx="18" fill="#ff9b85"/>
      <text x="380" y="257" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#3a1c14">CONVERSION</text>
      <rect x="240" y="312" width="280" height="78" rx="18" fill="url(#p2v)"/>
      <text x="380" y="361" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#fff">RETENTION</text>
    </g>

    <!-- node flow -->
    <g stroke="#b9a8f5" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round">
      <path d="M140 540 H300 V480 H460 V540 H620 V480 H780" fill="none"/>
    </g>
    <g>
      <circle cx="140" cy="540" r="26" fill="#633ef2"/>
      <circle cx="460" cy="540" r="26" fill="#ff7a66"/>
      <circle cx="780" cy="480" r="26" fill="#633ef2"/>
    </g>
  </g>

  <!-- sticky notes -->
  <g transform="rotate(-8 1080 170)">
    <rect x="990" y="110" width="150" height="150" rx="14" fill="#ffd9c8"/>
    <rect x="1015" y="150" width="100" height="12" rx="6" fill="#c66a55" opacity="0.7"/>
    <rect x="1015" y="180" width="80" height="12" rx="6" fill="#c66a55" opacity="0.45"/>
  </g>

  <rect x="390" y="770" width="420" height="56" rx="28" fill="#171326" opacity="0.85"/>
  <text x="600" y="806" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="3" fill="#f7f4f0">PROJECT PLACEHOLDER 02</text>
</svg>
